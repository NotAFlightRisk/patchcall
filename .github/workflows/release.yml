name: 📦 Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: 📦 Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Draft the release
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "false" ]; then
            echo "::error::$TAG is already published, and releases here can't be changed once they are"
            exit 1
          fi
          [ "$draft" = "true" ] || gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
      - name: Build and attach the binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish it
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
      - name: Summary
        run: |
          {
            echo "### Released $TAG"
            echo
            echo '```'
            printf '%s\n' dist/*.tar.gz dist/checksums.txt*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
