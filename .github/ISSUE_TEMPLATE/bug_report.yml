name: 🐛 Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: I expected X, but Y happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reliably triggers it.
      placeholder: |
        1. Run '...'
        2. Send a request to '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you on? (release tag, commit SHA, or Docker tag)
      placeholder: 1.2.3
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Docker run
        - A release binary
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Docker (or Podman) version, plus the image if it's a wrong match.
      placeholder: Debian 13, Docker 29.0, lscr.io/linuxserver/sonarr:latest
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Patchcall's logs, or the app's entry from /api/status. Formatted as code automatically, so no backticks needed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am running the latest version
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/NotAFlightRisk/patchcall/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
