- untracked: Doesn't publish GitHub security advisories, so there's nothing here to watch.
  images: [postgres, redis, valkey/valkey, mariadb, mysql, mongo, memcached, alpine, busybox,
    ubuntu, debian, clickhouse/clickhouse-server, rabbitmq, tecnativa/docker-socket-proxy,
    lscr.io/linuxserver/socket-proxy, linuxserver/socket-proxy]
