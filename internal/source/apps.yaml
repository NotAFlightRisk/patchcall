# Which repo publishes the advisories for each image. Your overrides file uses the same shape.
- name: Immich
  repo: immich-app/immich
  images: [ghcr.io/immich-app/immich-server, ghcr.io/immich-app/immich-machine-learning]
- name: Jellyfin
  repo: jellyfin/jellyfin
  images: [jellyfin/jellyfin, ghcr.io/jellyfin/jellyfin, lscr.io/linuxserver/jellyfin,
    linuxserver/jellyfin]
- name: Nextcloud
  repo: nextcloud/security-advisories
  env: NEXTCLOUD_VERSION
  only: [server]
  images: [nextcloud, lscr.io/linuxserver/nextcloud, linuxserver/nextcloud]
- name: Vaultwarden
  repo: dani-garcia/vaultwarden
  images: [vaultwarden/server, ghcr.io/dani-garcia/vaultwarden]
- name: Home Assistant
  repo: home-assistant/core
  skip: [supervisor, companion, operating system, websocket]
  images: [ghcr.io/home-assistant/home-assistant, homeassistant/home-assistant,
    lscr.io/linuxserver/homeassistant, linuxserver/homeassistant]
- name: Paperless-ngx
  repo: paperless-ngx/paperless-ngx
  images: [ghcr.io/paperless-ngx/paperless-ngx, paperlessngx/paperless-ngx]
- name: Uptime Kuma
  repo: louislam/uptime-kuma
  skip: [dockge]
  images: [louislam/uptime-kuma]
- name: Gitea
  repo: go-gitea/gitea
  images: [gitea/gitea]
- name: Pi-hole
  repo: pi-hole/pi-hole
  unversioned: >-
    The image is versioned by Docker release, but Pi-hole's advisories use core
    versions, so there's nothing safe to match against.
  images: [pihole/pihole]
- name: AdGuard Home
  repo: AdguardTeam/AdGuardHome
  images: [adguard/adguardhome]
- name: Traefik
  repo: traefik/traefik
  images: [traefik, traefik/traefik]
- name: Nginx Proxy Manager
  repo: NginxProxyManager/nginx-proxy-manager
  env: NPM_BUILD_VERSION
  images: [jc21/nginx-proxy-manager]
- name: Portainer
  repo: portainer/portainer
  images: [portainer/portainer-ce, portainer/portainer-ee]
- name: Audiobookshelf
  repo: advplyr/audiobookshelf
  images: [ghcr.io/advplyr/audiobookshelf, advplyr/audiobookshelf]
- name: Navidrome
  repo: navidrome/navidrome
  images: [deluan/navidrome, ghcr.io/navidrome/navidrome]
- name: Syncthing
  repo: syncthing/syncthing
  images: [syncthing/syncthing, lscr.io/linuxserver/syncthing, linuxserver/syncthing]
- name: FreshRSS
  repo: FreshRSS/FreshRSS
  images: [freshrss/freshrss, lscr.io/linuxserver/freshrss, linuxserver/freshrss]
- name: Miniflux
  repo: miniflux/v2
  images: [miniflux/miniflux, ghcr.io/miniflux/miniflux]
- name: linkding
  repo: sissbruecker/linkding
