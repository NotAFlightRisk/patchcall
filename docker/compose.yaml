services:
  patchcall:
    image: ghcr.io/notaflightrisk/patchcall:latest
    container_name: patchcall
    restart: unless-stopped
    ports:
      - 127.0.0.1:7282:7282
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      TZ: Europe/London
      # GITHUB_TOKEN: github_pat_...
      # PATCHCALL_NTFY_URL: https://ntfy.sh/your-secret-topic
    volumes:
      - patchcall:/data
      # - ./overrides.yaml:/data/overrides.yaml:ro
    depends_on:
      - socket-proxy

  # Only lets Patchcall read containers and images, so it never holds the keys to your host
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: patchcall-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  patchcall:
